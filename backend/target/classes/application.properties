spring.application.name=ai-code-assistant-backend

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - Using SQLite (no additional installation required)
spring.datasource.url=jdbc:sqlite:./data/example_db.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=you username
spring.datasource.password=you password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:your-api-key-here}
openai.api.url=https://api.openai.com/v1/chat/completions

# Logging Configuration
logging.level.com.aicodeassistant=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
